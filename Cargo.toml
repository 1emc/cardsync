[package]
name = "galcard-workspace"
edition = "2021"
version = "0.1.0"
license = "MIT"

[workspace]
members = [
  "crates/api",
  "crates/domain",
  "crates/graph",
  "crates/carddav",
  "crates/vcard",
  "crates/privacy",
]
resolver = "2"

[workspace.package]
edition = "2021"
license = "MIT"
version = "0.1.0"

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5"
async-trait = "0.1"
axum = { version = "0.7", features = ["macros"] }
base64 = "0.22"
chrono = { version = "0.4", features = ["serde"] }
dotenvy = "0.15"
hex = "0.4"
hmac = "0.12"
http = "1"
password-hash = "0.5"
quick-xml = "0.36"
rand = "0.8"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sqlx = { version = "0.8", features = ["runtime-tokio-rustls", "postgres", "uuid", "chrono", "json", "macros", "migrate"] }
subtle = "2"
thiserror = "1"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "signal"] }
tower = "0.5"
tower-http = { version = "0.6", features = ["trace", "request-id", "util"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
uuid = { version = "1", features = ["v4", "serde"] }

[dev-dependencies]
base64.workspace = true
carddav = { path = "crates/carddav" }
chrono.workspace = true
domain = { path = "crates/domain" }
privacy = { path = "crates/privacy" }
uuid.workspace = true
vcard = { path = "crates/vcard" }
